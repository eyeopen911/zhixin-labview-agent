name: source-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/scan_source.py
      - run: python -m unittest discover -s . -p 'tests_*.py' -q
        env:
          NI_AGENT_PROVIDER: disabled
          NI_AGENT_ENABLE_REMOTE: '0'
